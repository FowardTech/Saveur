apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Release signing credentials live in android/keystore.properties -- NOT
// committed to git (see .gitignore). Falls back to debug signing if that
// file doesn't exist yet, so a fresh checkout still builds; create the file
// (storeFile/storePassword/keyAlias/keyPassword, see ANDROID_RELEASE.md /
// the setup instructions) to switch release builds to real signing.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.saveur.app"
    defaultConfig {
        applicationId "com.saveur.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        // AndroidManifest.xml references ${usesCleartextTraffic} but nothing
        // ever defined that placeholder -- explicitly resolving it here so
        // the manifest merge can't fail. false = only HTTPS allowed, which
        // matches the app's real backend (Cloudflare tunnel HTTPS) and iOS's
        // equally strict ATS setting; no reason to allow plaintext HTTP here.
        manifestPlaceholders = [usesCleartextTraffic: "false"]
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseKeystore) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Real release signing once android/keystore.properties exists
            // (see setup instructions); falls back to the debug key
            // otherwise so the project still builds out of the box --
            // BUT a debug-signed release build cannot be uploaded to the
            // Play Store, only used for local sideload testing.
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // GIF support for RN's <Image> component (product request: "replace the
    // blue round ball in the AI coach screen and the voice interview screen
    // with the GIF image" — components/InAppVideoPlayer.tsx and
    // src/messages/VoiceCoachView.tsx / src/practice/LiveInterviewSession.tsx
    // now use an animated GIF, assets/images/orb_gradient.gif). RN's Image
    // plays animated GIFs out of the box on iOS, but on Android it silently
    // just renders the FIRST FRAME as a static image unless Fresco's
    // animated-gif decoder module is explicitly added — it is NOT pulled in
    // automatically by com.facebook.react:react-android above, even though
    // that artifact does bundle Fresco itself for plain static images.
    // Version pinned to exactly match this project's react-native (0.82.1)
    // own internal Fresco version (node_modules/react-native/gradle/
    // libs.versions.toml's `fresco` entry) to avoid a resolution conflict
    // with whatever version react-android already depends on.
    implementation("com.facebook.fresco:animated-gif:3.6.0")

    // Explicit Android SplashScreen API support — targetSdkVersion 36 means
    // the OS *mandatorily* shows its own system splash screen on API 31+
    // before MainActivity draws, auto-derived from the launcher icon if we
    // don't configure it ourselves. That auto-derivation was rendering the
    // logo blown up edge-to-edge instead of a modest centered mark (see
    // Theme.App.SplashScreen in styles.xml + installSplashScreen() in
    // MainActivity.kt). This library also back-ports the same behavior to
    // API < 31 so it's consistent everywhere, replacing the old plain
    // AppTheme.Main windowBackground trick as the actual first-paint theme.
    implementation("androidx.core:core-splashscreen:1.0.1")
}

// Must be applied after the android {} block. Reads google-services.json in
// this same directory (android/app/) — now the real file from the "saveur-ac8ec"
// Firebase project, registered under package name "com.saveur.app" (matches
// this project's applicationId, above).
apply plugin: "com.google.gms.google-services"
